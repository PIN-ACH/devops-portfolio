# The DB credentials Secret is NOT stored in Git (that would leak secrets).
# Instead it is created at deploy time from AWS Secrets Manager. Run:
#
#   SECRET_ARN=$(terraform -chdir=terraform/envs/dev output -raw rds_secret_arn)
#   CREDS=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
#            --query SecretString --output text)
#   kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n app create secret generic db-credentials \
#     --from-literal=DB_HOST=$(echo "$CREDS" | jq -r .host) \
#     --from-literal=DB_PORT=$(echo "$CREDS" | jq -r .port) \
#     --from-literal=DB_USER=$(echo "$CREDS" | jq -r .username) \
#     --from-literal=DB_PASSWORD=$(echo "$CREDS" | jq -r .password) \
#     --from-literal=DB_NAME=$(echo "$CREDS" | jq -r .dbname) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For a production-grade solution, use the External Secrets Operator to sync
# Secrets Manager -> Kubernetes automatically. See docs/SECURITY.md.
