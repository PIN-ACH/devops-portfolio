# Argo CD App-of-Apps / monitoring stack via Argo CD.
# Deploys the kube-prometheus-stack Helm chart (Prometheus + Grafana +
# Alertmanager + node-exporter) into the monitoring namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 62.3.0
    helm:
      valueFiles: []
      values: |
        grafana:
          adminPassword: "changeme-set-via-secret"
          service:
            type: LoadBalancer
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
