apiVersion: v1
kind: ConfigMap
metadata:
  name: node-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-app-dashboard.json: |
    {
      "title": "Node App Overview",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_request_duration_seconds_count[5m])) by (route)", "legendFormat": "{{route}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error rate (5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum(rate(http_request_duration_seconds_count{status_code=~\"5..\"}[5m]))", "legendFormat": "5xx" }
          ]
        },
        {
          "type": "stat",
          "title": "Process memory (MB)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "process_resident_memory_bytes / 1024 / 1024", "legendFormat": "rss" }
          ]
        }
      ]
    }
